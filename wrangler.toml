name = "nusantara-wedding-platform"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "wedding_platform_db"
database_id = "00000000-0000-0000-0000-000000000000" # Ganti dengan database_id D1 Anda

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "wedding-media-assets"
